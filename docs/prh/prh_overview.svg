<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2010" viewBox="0 0 1400 2010" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<style>
.t{font-size:15px;fill:#222}.s{font-size:13px;fill:#333}.xs{font-size:11.5px;fill:#555}
.h{font-size:21px;font-weight:bold;fill:#111}.b{font-weight:bold}
.box{stroke:#333;stroke-width:1.3;rx:8}
</style>
</defs>
<rect width="1400" height="2010" fill="#fbfbf8"/>
<text x="40" y="48" font-size="28" font-weight="bold" fill="#111">Platonic Representation Hypothesis with JEPAs → what it means for our robot world models</text>
<text x="40" y="74" class="s">Balestriero &amp; LeCun, arXiv 2610.39302 · Space: galilai-group/prh_demo · Our results: simulator / offline real video only (no physical robot)</text>

<!-- A: good vs bad views -->
<rect x="30" y="95" width="1340" height="330" fill="#fff" class="box"/>
<text x="50" y="125" class="h">A. The one idea: which pairs count as "the same" (positive views)</text>
<!-- good -->
<rect x="60" y="145" width="620" height="200" fill="#eaf6ec" class="box"/>
<text x="80" y="172" class="t b" fill="#1e7a3a">GOOD views = two different observations of one world state</text>
<circle cx="150" cy="255" r="34" fill="#cfe9d5" stroke="#1e7a3a"/><text x="150" y="252" text-anchor="middle" class="s b">world</text><text x="150" y="268" text-anchor="middle" class="s b">state z</text>
<rect x="290" y="195" width="160" height="40" fill="#fff" class="box"/><text x="370" y="220" text-anchor="middle" class="s">caption 1 / frame t</text>
<rect x="290" y="275" width="160" height="40" fill="#fff" class="box"/><text x="370" y="300" text-anchor="middle" class="s">caption 2 / frame t'</text>
<line x1="184" y1="245" x2="288" y2="215" stroke="#333" marker-end="url(#a)"/><line x1="184" y1="265" x2="288" y2="295" stroke="#333" marker-end="url(#a)"/>
<text x="470" y="225" class="xs">nuisances independent</text><text x="470" y="243" class="xs">(wording, lighting, view)</text>
<text x="470" y="270" class="xs">→ encoder keeps only z</text><text x="470" y="288" class="xs">→ modalities agree up to</text><text x="470" y="306" class="xs">   ONE rotation (ρ=1)</text>
<text x="80" y="333" class="xs">measured ρ = .804 (Flickr text JEPA, k=32)</text>
<!-- bad -->
<rect x="710" y="145" width="640" height="200" fill="#fbeaea" class="box"/>
<text x="730" y="172" class="t b" fill="#a52a2a">BAD views = two corruptions of one observation</text>
<rect x="740" y="235" width="120" height="40" fill="#fff" class="box"/><text x="800" y="260" text-anchor="middle" class="s">one image</text>
<rect x="940" y="195" width="120" height="36" fill="#fff" class="box"/><text x="1000" y="218" text-anchor="middle" class="s">crop / mask 1</text>
<rect x="940" y="280" width="120" height="36" fill="#fff" class="box"/><text x="1000" y="303" text-anchor="middle" class="s">crop / mask 2</text>
<line x1="862" y1="248" x2="938" y2="214" stroke="#333" marker-end="url(#a)"/><line x1="862" y1="262" x2="938" y2="297" stroke="#333" marker-end="url(#a)"/>
<text x="1080" y="215" class="xs">nuisance is SHARED → encoder</text><text x="1080" y="233" class="xs">spends dimensions on it →</text><text x="1080" y="251" class="xs">no rotation can align those</text>
<text x="1080" y="280" class="xs">e.g. DINO, V-JEPA (crops/masks)</text><text x="1080" y="298" class="xs">next-token prediction = bad-view</text><text x="1080" y="316" class="xs">JEPA (prefix → continuation)</text>
<text x="730" y="333" class="xs">measured ρ = .655 (masked spans), .608 (next-token)</text>
<text x="60" y="375" class="t"><tspan class="b">Flickr, text JEPA vs image JEPA:</tspan> mutual 10-NN good .062 · bad .047 · next-token .042   |   R@1 .044 · .027 · .021</text>
<text x="60" y="400" class="t"><tspan class="b">At scale:</tspan> 109M good-view text JEPA vs DINOv2 on WIT: .184 vs Qwen2.5-72B .154 · same alignment with 42× fewer samples than next-token</text>

<!-- B: theory -->
<rect x="30" y="440" width="1340" height="250" fill="#fff" class="box"/>
<text x="50" y="470" class="h">B. Theory chain (idealized: finite world, population optima, identity predictor)</text>
<g class="s">
<rect x="50" y="490" width="235" height="110" fill="#eef3fb" class="box"/>
<text x="62" y="514" class="b">1. Same positives</text><text x="62" y="536">all modalities use the</text><text x="62" y="554">same pair distribution π</text><text x="62" y="572">over world states</text>
<rect x="315" y="490" width="235" height="110" fill="#eef3fb" class="box"/>
<text x="327" y="514" class="b">2. Spectral embedding</text><text x="327" y="536">L2 + whitening → top-k</text><text x="327" y="554">eigenvectors of the pair</text><text x="327" y="572">graph K (Laplacian eigenmaps)</text>
<rect x="580" y="490" width="235" height="110" fill="#eef3fb" class="box"/>
<text x="592" y="514" class="b">3. Platonic theorem</text><text x="592" y="536">unique up to rotation if</text><text x="592" y="554">eigengap → f_m(g_m) = Q_m h*</text><text x="592" y="572">one rotation Q_m per modality</text>
<rect x="845" y="490" width="235" height="110" fill="#fdf3e4" class="box"/>
<text x="857" y="514" class="b">4. Different positives</text><text x="857" y="536">misalignment ≤ (2√2/δ)·</text><text x="857" y="554">|K1 − K2| → big-gap directions</text><text x="857" y="572">align, tail ones need not</text>
<rect x="1110" y="490" width="240" height="110" fill="#fdf3e4" class="box"/>
<text x="1122" y="514" class="b">5. Nuisance cost</text><text x="1122" y="536">bad views keep nuisance →</text><text x="1122" y="554">error ≥ 2k(1 − min ρ)</text><text x="1122" y="572">no rotation can fix it</text>
</g>
<line x1="286" y1="545" x2="313" y2="545" stroke="#333" marker-end="url(#a)"/><line x1="551" y1="545" x2="578" y2="545" stroke="#333" marker-end="url(#a)"/><line x1="816" y1="545" x2="843" y2="545" stroke="#333" marker-end="url(#a)"/><line x1="1081" y1="545" x2="1108" y2="545" stroke="#333" marker-end="url(#a)"/>
<text x="50" y="630" class="s"><tspan class="b">Rotation needs pairs:</tspan> first/second moments can't pin it (Prop. 2); k pairs (Procrustes) or higher-order geometry (pair-free optimal transport) can.</text>
<text x="50" y="652" class="s"><tspan class="b">Views × data:</tspan> good views fix the world kernel by design; bad views must recover it from dense data overlap. Scaling law in (good-view fraction q, samples M, images N)</text>
<text x="50" y="672" class="s">predicts 85 unseen runs at RMSE .0093 (seed noise .0096).   <tspan fill="#a52a2a" class="b">Not covered: action-conditioned predictors (world models).</tspan></text>

<!-- C: Space -->
<rect x="30" y="705" width="1340" height="370" fill="#fff" class="box"/>
<text x="50" y="735" class="h">C. The Space "Captions Without Pairs": no network ever trained on an image–caption pair</text>
<g class="s">
<rect x="50" y="760" width="120" height="60" fill="#fff" class="box"/><text x="110" y="795" text-anchor="middle">photo</text>
<rect x="200" y="755" width="200" height="70" fill="#eef3fb" class="box"/><text x="300" y="780" text-anchor="middle" class="b">frozen image SSL</text><text x="300" y="800" text-anchor="middle">DINOv2-g + DINOv3-L</text><text x="300" y="817" text-anchor="middle" class="xs">(mean of tokens, concatenated)</text>
<rect x="430" y="755" width="200" height="70" fill="#fff4d6" class="box"/><text x="530" y="780" text-anchor="middle" class="b">ONE rotation R</text><text x="530" y="800" text-anchor="middle">Procrustes on pairs</text><text x="530" y="817" text-anchor="middle" class="xs">(only part that sees pairs)</text>
<rect x="660" y="755" width="200" height="70" fill="#eaf6ec" class="box"/><text x="760" y="780" text-anchor="middle" class="b">text-JEPA space</text><text x="760" y="800" text-anchor="middle">good-view BERT JEPA</text><text x="760" y="817" text-anchor="middle" class="xs">(from scratch, text only)</text>
<rect x="890" y="755" width="220" height="70" fill="#eaf6ec" class="box"/><text x="1000" y="780" text-anchor="middle" class="b">text-only decoder</text><text x="1000" y="800" text-anchor="middle">Qwen2.5-1.5B, trained on</text><text x="1000" y="817" text-anchor="middle" class="xs">noisy text embeddings (σ≈3)</text>
<rect x="1140" y="760" width="200" height="60" fill="#fff" class="box"/><text x="1240" y="787" text-anchor="middle">caption</text><text x="1240" y="805" text-anchor="middle" class="xs">COCO CIDEr .838</text>
</g>
<line x1="171" y1="790" x2="198" y2="790" stroke="#333" marker-end="url(#a)"/><line x1="401" y1="790" x2="428" y2="790" stroke="#333" marker-end="url(#a)"/><line x1="631" y1="790" x2="658" y2="790" stroke="#333" marker-end="url(#a)"/><line x1="861" y1="790" x2="888" y2="790" stroke="#333" marker-end="url(#a)"/><line x1="1111" y1="790" x2="1138" y2="790" stroke="#333" marker-end="url(#a)"/>
<text x="50" y="860" class="t b">Video mode (demo.py)</text>
<g class="s">
<rect x="50" y="872" width="150" height="62" fill="#fff" class="box"/><text x="125" y="898" text-anchor="middle">video → ~1 fps</text><text x="125" y="918" text-anchor="middle" class="xs">(≤120 s)</text>
<rect x="225" y="872" width="170" height="62" fill="#eef3fb" class="box"/><text x="310" y="898" text-anchor="middle">"watcher" DINOv2-S</text><text x="310" y="918" text-anchor="middle" class="xs">embeds every frame</text>
<rect x="420" y="872" width="220" height="62" fill="#fff4d6" class="box"/><text x="530" y="895" text-anchor="middle">chunk: new when cos to</text><text x="530" y="913" text-anchor="middle">chunk mean &lt; .45 or 5 frames</text><text x="530" y="929" text-anchor="middle" class="xs">(≤ ~12 chunks)</text>
<rect x="665" y="872" width="220" height="62" fill="#fff4d6" class="box"/><text x="775" y="895" text-anchor="middle">2 most typical frames →</text><text x="775" y="913" text-anchor="middle">rotate → average</text><text x="775" y="929" text-anchor="middle" class="xs">reuse caption if cos ≥ .97</text>
<rect x="910" y="872" width="210" height="62" fill="#eaf6ec" class="box"/><text x="1015" y="898" text-anchor="middle">caption per changed chunk</text><text x="1015" y="918" text-anchor="middle" class="xs">+ length-weighted whole video</text>
<rect x="1145" y="872" width="195" height="62" fill="#fff" class="box"/><text x="1242" y="898" text-anchor="middle">MSR-VTT CIDEr .246</text><text x="1242" y="918" text-anchor="middle" class="xs">no network trained on video</text>
</g>
<line x1="201" y1="903" x2="223" y2="903" stroke="#333" marker-end="url(#a)"/><line x1="396" y1="903" x2="418" y2="903" stroke="#333" marker-end="url(#a)"/><line x1="641" y1="903" x2="663" y2="903" stroke="#333" marker-end="url(#a)"/><line x1="886" y1="903" x2="908" y2="903" stroke="#333" marker-end="url(#a)"/><line x1="1121" y1="903" x2="1143" y2="903" stroke="#333" marker-end="url(#a)"/>
<text x="50" y="970" class="t b">Search mode</text><text x="170" y="970" class="s">description → text JEPA → compare with rotated embeddings of 1.28M ImageNet photos (same space)</text>
<text x="50" y="998" class="t b">Training recipe (prh-proof + stable-pretraining)</text>
<text x="50" y="1022" class="s">LeJEPA loss = pull every view to the mean of global views + λ·SIGReg (1024 random 1-D projections, λ=.02 / .01 at 940M) · no predictor, no EMA teacher</text>
<text x="50" y="1044" class="s">views.py: list item (captions / clip frames) → each view draws its own element = GOOD; single item → crops/masks = BAD; --good-views q mixes them</text>
<text x="50" y="1064" class="s">Compute: Flickr arm 1–2 GPU-h · scaling run ~5 GPU-h (×145) · 940M BERT-B 200–400 GPU-h per arm on 8–16 GPUs · total ≈ 5,500 GPU-h over 345 runs</text>

<!-- D: our loop -->
<rect x="30" y="1090" width="1340" height="400" fill="#fff" class="box"/>
<text x="50" y="1120" class="h">D. Our robot loop: where PRH applies and where our bottleneck actually is</text>
<g class="s">
<rect x="50" y="1150" width="150" height="80" fill="#fff" class="box"/><text x="125" y="1180" text-anchor="middle" class="b">sensors</text><text x="125" y="1200" text-anchor="middle">cameras +</text><text x="125" y="1217" text-anchor="middle">proprio</text>
<rect x="230" y="1140" width="230" height="100" fill="#eaf6ec" stroke="#1e7a3a" stroke-width="2.5" rx="8"/><text x="345" y="1165" text-anchor="middle" class="b">frozen encoder</text><text x="345" y="1185" text-anchor="middle">V-JEPA 2.1 ViT-G / DINOv3</text><text x="345" y="1207" text-anchor="middle" fill="#1e7a3a" class="b">OK: true frames → fine .93</text><text x="345" y="1226" text-anchor="middle" class="xs">640 px no better than 320 px</text>
<rect x="490" y="1140" width="260" height="100" fill="#fbeaea" stroke="#c0392b" stroke-width="3" rx="8"/><text x="620" y="1165" text-anchor="middle" class="b">action-conditioned predictor</text><text x="620" y="1185" text-anchor="middle">RoboJEPA · LeWM · V-JEPA 2-AC</text><text x="620" y="1207" text-anchor="middle" fill="#c0392b" class="b">BOTTLENECK: fine .36 / .44</text><text x="620" y="1226" text-anchor="middle" class="xs">(22M / 1B, same 160 anchors)</text>
<rect x="780" y="1150" width="180" height="80" fill="#eef3fb" class="box"/><text x="870" y="1180" text-anchor="middle" class="b">score actions</text><text x="870" y="1200" text-anchor="middle">L1 to goal</text><text x="870" y="1217" text-anchor="middle">features</text>
<rect x="990" y="1150" width="170" height="80" fill="#eef3fb" class="box"/><text x="1075" y="1180" text-anchor="middle" class="b">CEM / MPC</text><text x="1075" y="1200" text-anchor="middle">receding</text><text x="1075" y="1217" text-anchor="middle">horizon</text>
<rect x="1190" y="1150" width="150" height="80" fill="#fff" class="box"/><text x="1265" y="1180" text-anchor="middle" class="b">controller</text><text x="1265" y="1200" text-anchor="middle">→ new</text><text x="1265" y="1217" text-anchor="middle">observation</text>
</g>
<line x1="201" y1="1190" x2="228" y2="1190" stroke="#333" marker-end="url(#a)"/><line x1="461" y1="1190" x2="488" y2="1190" stroke="#333" marker-end="url(#a)"/><line x1="751" y1="1190" x2="778" y2="1190" stroke="#333" marker-end="url(#a)"/><line x1="961" y1="1190" x2="988" y2="1190" stroke="#333" marker-end="url(#a)"/><line x1="1161" y1="1190" x2="1188" y2="1190" stroke="#333" marker-end="url(#a)"/>
<path d="M1265,1232 L1265,1262 L125,1262 L125,1232" fill="none" stroke="#333" stroke-dasharray="5,4" marker-end="url(#a)"/>
<text x="560" y="1280" class="xs">closed loop (simulator / offline video)</text>
<rect x="230" y="1290" width="230" height="28" fill="#1e7a3a" rx="6"/><text x="345" y="1309" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">PRH theory covers this box</text>
<rect x="490" y="1290" width="260" height="28" fill="#c0392b" rx="6"/><text x="620" y="1309" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">PRH does NOT cover this box</text>
<text x="50" y="1345" class="t b">What else we measured</text>
<g class="s">
<text x="50" y="1368">• Action size ±10% (held-out DROID): Meta 1B .86 · Meta 22M .68 · V-JEPA 2-AC .57 · Ctrl-World .54 → fine motion size is hard for every world model</text>
<text x="50" y="1390">• LeWM already uses SIGReg-style anti-collapse; adding a hinge moved its lowest error toward ×1 but flattened the curve → anti-collapse alone isn't the fix</text>
<text x="50" y="1412">• Same predictor, DINOv3 vs V-JEPA features: lower prediction L1 (.091 vs .244) but worse control (CEM 4.12 vs 1.79 cm) → feature error ≠ control quality</text>
<text x="50" y="1434">• Size ladder: ranking plateaus at 300M–1B while imagination error keeps falling to 8B; CEM Reach 22M 0.57 cm vs 1B 0.85 cm (1B ~2× slower)</text>
<text x="50" y="1456">• Robot "good views" (our inference): synchronized cameras at the same timestep (DROID: 2 exterior + wrist). Two frames of one trajectory are NOT</text>
<text x="50" y="1476">   automatically good views for control: action, time, contact and object motion differ. Viewpoint, gripper pose and contact must be kept.</text>
</g>

<!-- E: directions -->
<rect x="30" y="1505" width="1340" height="480" fill="#fff" class="box"/>
<text x="50" y="1535" class="h">E. Directions for scaling later (single GPU, cheapest first, each gated by a kill test)</text>
<g class="s">
<rect x="50" y="1555" width="1300" height="58" fill="#eaf6ec" class="box"/><text x="65" y="1578" class="b">1. Multi-camera alignment check · ~1 GPU-h, no training</text><text x="65" y="1600">Embed same-timestep DROID camera frames with frozen V-JEPA 2.1 / DINOv3 → fit Procrustes on half → mutual 10-NN, ρ, camera-specific variance on the other half.</text>
<rect x="50" y="1623" width="1300" height="58" fill="#eaf6ec" class="box"/><text x="65" y="1646" class="b">2. Good-view targets for the predictor · ~2–3 GPU-h smoke (hypothesis)</text><text x="65" y="1668">Predict the pooled multi-camera embedding at t+1 instead of one camera's. Kill test: ±10% action-size curve + fine ranking vs single-camera control, same compute.</text>
<rect x="50" y="1691" width="1300" height="58" fill="#eef3fb" class="box"/><text x="65" y="1714" class="b">3. Copy their scaling-law method before any big run</text><text x="65" y="1736">6–10 small runs over (fraction of good-view targets q, samples M) → fit R = a + d·log M + b·log(1 + q^α M^β N^γ / c) → scale only if the fit predicts a gain above noise.</text>
<rect x="50" y="1759" width="1300" height="58" fill="#fff4d6" class="box"/><text x="65" y="1782" class="b">4. Actions as a modality (theory allows it, untested)</text><text x="65" y="1804">Small JEPA on action/proprio chunks → rotate onto visual change (z_t+1 − z_t) with few pairs. If they align: pair-light inverse model + an action-sensitivity probe.</text>
<rect x="50" y="1827" width="1300" height="58" fill="#fff4d6" class="box"/><text x="65" y="1850" class="b">5. Public demo, zero training</text><text x="65" y="1872">Run the Space's video chunker + rotation captioner on DROID clips: "what is the robot doing, step by step". Shows what frozen features see, and it ships.</text>
<rect x="50" y="1895" width="1300" height="72" fill="#fbeaea" class="box"/><text x="65" y="1918" class="b" fill="#a52a2a">Not worth it on the numbers</text><text x="65" y="1940">• Re-running PRH at 940M scale (200–400 GPU-h per arm on 8+ GPUs, and it's text alignment, not control)</text><text x="65" y="1960">• Swapping our encoder for a PRH JEPA or training higher resolution: the encoder already ranks at .93 on true frames</text>
</g>
<text x="40" y="2000" class="xs">All robotics mappings are our inference; the paper has no action-conditioned or robot experiments. Numbers: paper, prh-proof code, our Isambard runs.</text>
</svg>
